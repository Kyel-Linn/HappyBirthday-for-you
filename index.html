<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! ✨</title>
    <style>
        :root {
            --bg-color: #d4d3d3;
            --card-bg: #f3f4f5;
            --text-primary: #4A4A4A;
            --text-secondary: #718096;
            --accent-pink: #FFB6C1;
            --cake-layer-1: #f5abbc;
            --cake-layer-2: #faced5;
            --frosting: #fdf0f5;
            --candle-body: #2cb1ff;
            --flame: #ef7a0c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
            transform: translateY(20px);
            opacity: 0;
            animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        h1 {
            color: var(--text-primary);
            font-size: 2rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 30px;
        }

        /* SVG Cake Styling & Layout */
        .cake-container {
            width: 200px;
            height: 200px;
            margin: 0 auto 30px auto;
            cursor: pointer;
            position: relative;
        }

        .flame {
            animation: flicker 0.6s ease-in-out infinite alternate;
            transform-origin: center bottom;
        }

        .instruction {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: -15px;
            margin-bottom: 30px;
            font-style: italic;
        }

        .message-box {
            border-top: 1px solid #F0F0F0;
            padding-top: 25px;
            margin-top: 10px;
            color: var(--text-primary);
            line-height: 1.6;
            font-size: 1.05rem;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .message-box.reveal {
            opacity: 1;
            transform: translateY(0);
        }

        /* Confetti Canvas */
        #confetti {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        /* Animations */
        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes flicker {
            0% { transform: scale(1) rotate(-2deg); cubic-bezier (0.16, 1, 0.3, 1); }
            100% { transform: scale(1.1) rotate(2deg); cubic-bezier (0.16, 1, 0.3, 1); }
        }

        @keyframes blowOut {
            to { opacity: 0; transform: scale(0); }
        }

        .extinguished {
            animation: blowOut 0.4s forwards;
        }
    </style>
</head>
<body>

    <canvas id="confetti"></canvas>

    <div class="container">
        <h1>Happy Birthday, Thae Tone! ✨</h1>
        <p class="subtitle">Click the candles to make a wish</p>

        <div class="cake-container" id="cake" onclick="blowCandles()">
            <svg viewBox="0 0 200 200" width="100%" height="100%">
                <rect x="75" y="40" width="8" height="30" fill="var(--candle-body)" rx="2"/>
                <path class="flame" id="flame1" d="M79,20 C83,28 79,38 79,38 C79,38 75,28 79,20 Z" fill="var(--flame)"/>
                
                <rect x="96" y="35" width="8" height="35" fill="var(--candle-body)" rx="2"/>
                <path class="flame" id="flame2" d="M100,12 C104,20 100,33 100,33 C100,33 96,20 100,12 Z" fill="var(--flame)"/>
                
                <rect x="117" y="40" width="8" height="30" fill="var(--candle-body)" rx="2"/>
                <path class="flame" id="flame3" d="M121,20 C125,28 121,38 121,38 C121,38 117,28 121,20 Z" fill="var(--flame)"/>

                <ellipse cx="100" cy="160" rx="80" ry="15" fill="#E2E8F0"/>

                <path d="M35,110 L35,150 C35,160 165,160 165,150 L165,110 Z" fill="var(--cake-layer-1)"/>
                
                <path d="M35,70 L35,110 C35,120 165,120 165,110 L165,70 Z" fill="var(--cake-layer-2)"/>
                
                <path d="M35,70 C35,70 50,80 60,75 C70,70 80,82 90,77 C100,72 110,85 120,78 C130,71 140,82 150,75 C160,68 165,70 165,70 C165,70 165,65 165,65 C165,65 35,65 35,65 Z" fill="var(--frosting)"/>
                <ellipse cx="100" cy="70" rx="65" ry="10" fill="var(--frosting)"/>
            </svg>
        </div>

        <div class="message-box" id="wishMessage">
            Wish you be the best you can be in your life and career and wish you to be spend the rest of our life together!
        </div>
    </div>

    <script>
        let candlesLit = true;

        function blowCandles() {
            if (!candlesLit) return;
            candlesLit = false;

            // Extinguish flames
            document.getElementById('flame1').classList.add('extinguished');
            document.getElementById('flame2').classList.add('extinguished');
            document.getElementById('flame3').classList.add('extinguished');

            // Reveal wishes
            document.getElementById('wishMessage').classList.add('reveal');

            // Trigger Confetti
            initConfetti();
        }

        // Lightweight programmatic confetti engine
        const canvas = document.getElementById('confetti');
        const ctx = canvas.getContext('2d');
        let pieces = [];
        const colors = ['#FFB6C1', '#FFD1DC', '#BEE3F8', '#FFF9E6', '#E2E8F0'];

        function initConfetti() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            for (let i = 0; i < 100; i++) {
                pieces.push({
                    x: window.innerWidth / 2 + (Math.random() - 0.5) * 40,
                    y: window.innerHeight / 2 + (Math.random() - 0.5) * 40,
                    size: Math.random() * 8 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speedX: (Math.random() - 0.5) * 10,
                    speedY: (Math.random() - 1) * 15,
                    gravity: 0.4,
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() - 0.5) * 10
                });
            }
            animateConfetti();
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            pieces.forEach((p, index) => {
                p.y += p.speedY;
                p.x += p.speedX;
                p.speedY += p.gravity;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rotation * Math.PI) / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();

                p.rotation += p.rotationSpeed;

                if (p.y > canvas.height) pieces.splice(index, 1);
            });

            if (pieces.length > 0) {
                requestAnimationFrame(animateConfetti);
            }
        }

        window.addEventListener('resize', () => {
            if (!candlesLit) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
        });
    </script>
</body>
</html>
